[workspace]
members = [
    "tools/smoke-test",
    "crates/struction_data",
    "crates/struction_core",
    "crates/struction_gravity",
    "crates/struction_physics",
    "crates/struction_character",
    "crates/struction_anim",
    "crates/struction_ai",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Headless-capable Bevy baseline. Applications that render add the graphics features themselves.
bevy = { version = "=0.19.1", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_log",
    "bevy_asset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonc-parser = { version = "0.34", features = ["serde", "cst"] }
schemars = "1"
thiserror = "2"
# Physics: only what the packages need; no picking, debug rendering, mesh colliders, or joints yet.
avian3d = { version = "0.7.0", default-features = false, features = ["3d", "f32", "parry-f32"] }
# Avian's interpolation backend; named directly only to inspect easing state.
bevy_transform_interpolation = "0.5"
uuid = { version = "1", default-features = false }

struction_data = { path = "crates/struction_data" }
struction_core = { path = "crates/struction_core" }
struction_gravity = { path = "crates/struction_gravity" }
struction_physics = { path = "crates/struction_physics" }
struction_character = { path = "crates/struction_character" }
struction_anim = { path = "crates/struction_anim" }
struction_ai = { path = "crates/struction_ai" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2
