[workspace]
members = [
    "tools/smoke-test",
    "apps/playground",
    "crates/struction_data",
    "crates/struction_core",
    "crates/struction_gravity",
    "crates/struction_physics",
    "crates/struction_character",
    "crates/struction_camera",
    "crates/struction_anim",
    "crates/struction_ai",
    "crates/struction_world",
    "crates/struction_debug",
    "crates/struction_assets",
    "crates/struction_editor",
    "apps/editor",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Headless-capable Bevy baseline. Applications that render add the graphics features themselves.
bevy = { version = "=0.19.1", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_log",
    "bevy_asset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonc-parser = { version = "0.34", features = ["serde", "cst"] }
schemars = "1"
thiserror = "2"
# Physics: only what the packages need; no picking, debug rendering, mesh colliders, or joints yet.
avian3d = { version = "0.7.0", default-features = false, features = ["3d", "f32", "parry-f32"] }
# Avian's interpolation backend; named directly only to inspect easing state.
bevy_transform_interpolation = "0.5"
uuid = { version = "1", default-features = false }
# Asset pipeline: zero-copy compiled format, glTF parsing, simplification (meshoptimizer), hulls.
rkyv = "0.8"
gltf = { version = "1.4", default-features = false, features = [
    "utils",
    "names",
    "KHR_materials_emissive_strength",
] }
meshopt = "0.6"
parry3d = { version = "0.27", default-features = false, features = ["required-features", "std", "alloc"] }
base64 = "0.22"
twox-hash = { version = "2", default-features = false, features = ["std", "xxhash3_64"] }
memmap2 = "0.9"
tempfile = "3"

struction_data = { path = "crates/struction_data" }
struction_core = { path = "crates/struction_core" }
struction_gravity = { path = "crates/struction_gravity" }
struction_physics = { path = "crates/struction_physics" }
struction_character = { path = "crates/struction_character" }
struction_camera = { path = "crates/struction_camera" }
struction_anim = { path = "crates/struction_anim" }
struction_ai = { path = "crates/struction_ai" }
struction_world = { path = "crates/struction_world" }
struction_debug = { path = "crates/struction_debug" }
struction_assets = { path = "crates/struction_assets" }
struction_playground = { package = "struction-playground", path = "apps/playground" }
struction_editor = { path = "crates/struction_editor" }
# Editor UI (adopted decision). 0.42 is the release for Bevy 0.19; 0.43 targets Bevy 0.20.
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }
# Native folder picker for opening projects (xdg-portal on Linux).
rfd = "0.17"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2
