[package]
name = "struction_world"
description = "Spawners, zones, save/load, path renaming."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `serialize` gives glam types (Transform fields) the serde impls the save format goes through.
bevy = { workspace = true, features = ["serialize"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
# Key renames go through the CST, like struction_data's value edits, to keep comments.
jsonc-parser = { workspace = true }
struction_data = { workspace = true }
struction_core = { workspace = true }

[dev-dependencies]
tempfile = "3"
