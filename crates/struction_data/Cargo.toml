[package]
name = "struction_data"
description = "JSONC sources: loading through Reflect, descendsFrom inheritance, presets, file:line errors, comment-preserving edits."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `serialize` gives glam vectors, quaternions and colors their serde impls (the reflect builder
# reads array-shaped values through them); `reflect_documentation` puts doc comments into the
# generated schema.
bevy = { workspace = true, features = ["serialize", "reflect_documentation"] }
# `preserve_order` keeps field order in values the editing API writes back.
serde_json = { workspace = true, features = ["preserve_order"] }
jsonc-parser = { workspace = true, features = ["serde_json"] }
thiserror = { workspace = true }
struction_core = { workspace = true }

[dev-dependencies]
tempfile = "3"
