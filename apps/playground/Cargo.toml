[package]
name = "struction-playground"
description = "Validation playground: the README scene, run natively."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Rust hotpatching through subsecond; run under `dx serve --hot-patch` (docs/live-reload.md).
hotpatching = ["bevy/hotpatching"]

[dependencies]
bevy = { workspace = true, features = [
    "bevy_color",
    "bevy_camera",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_light",
    "bevy_material",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_shader",
    "bevy_text",
    "default_font",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "keyboard",
    "mouse",
    "png",
    "tonemapping_luts",
    "zstd_rust",
    "wayland",
    "x11",
] }
struction_gravity = { workspace = true }
struction_physics = { workspace = true }
struction_character = { workspace = true }
struction_camera = { workspace = true }
struction_anim = { workspace = true }
struction_debug = { workspace = true }
struction_core = { workspace = true }
struction_data = { workspace = true }
struction_world = { workspace = true }
struction_assets = { workspace = true }
struction_scene = { workspace = true, features = ["render"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
